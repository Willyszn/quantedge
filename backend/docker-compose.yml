services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quantedge
      POSTGRES_PASSWORD: quantedge
      POSTGRES_DB: quantedge
    ports:
      - "5432:5432"
    volumes:
      - quantedge_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantedge"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://quantedge:quantedge@postgres:5432/quantedge
      DATABASE_URL_SYNC: postgresql+psycopg2://quantedge:quantedge@postgres:5432/quantedge
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5173
      MARKET_DATA_PROVIDER: mock
      SENTIMENT_PROVIDER: mock
      SEED_ON_STARTUP: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  quantedge_pg_data:
